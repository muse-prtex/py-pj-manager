<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="color-scheme" content="light">
<title data-i18n="app_title">PJマネージャー</title>
<style>
  :root{
    --accent:#2f6fed; --accent-dark:#1f55c4;
    --bg:#eef0f3; --card:#ffffff; --text:#1c2330; --muted:#66707f;
    --side:#171c26; --side-panel:#1f2634; --side-fg:#e6e9f0; --side-sub:#8b93a5;
    --line:#e2e6ec; --danger:#d64545;
    --radius:12px;
    --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  }
  *{box-sizing:border-box; margin:0; padding:0}
  html,body{height:100%}
  body{
    font-family:"Yu Gothic UI","Segoe UI","Noto Sans CJK JP",sans-serif;
    background:var(--bg); color:var(--text); display:flex; overflow:hidden;
    font-size:14px;
  }
  button{font-family:inherit; cursor:pointer}
  /* ---------- サイドバー ---------- */
  aside{
    width:300px; min-width:300px; background:var(--side); color:var(--side-fg);
    display:flex; flex-direction:column; padding:18px 14px 12px;
  }
  aside h1{font-size:19px; font-weight:700; color:#fff; letter-spacing:.02em}
  aside .sub{font-size:10px; letter-spacing:.28em; color:var(--side-sub); margin-top:2px}
  .search{
    margin:16px 0 8px; background:var(--side-panel); border:1px solid #2a3345;
    border-radius:8px; color:var(--side-fg); padding:7px 10px; width:100%;
    font-family:inherit; font-size:13px; outline:none;
  }
  .search:focus{border-color:var(--accent)}
  .search::placeholder{color:var(--side-sub)}
  .side-label{font-size:11px; font-weight:700; color:var(--side-sub); margin:6px 2px}
  #list{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:4px; padding-right:2px}
  .item{
    background:transparent; border:1px solid transparent; border-radius:9px;
    padding:8px 10px; text-align:left; color:var(--side-fg); width:100%;
  }
  .item:hover{background:var(--side-panel)}
  .item.sel{background:var(--side-panel); border-color:#33405a}
  .item .name{font-size:14px; font-weight:600; display:flex; align-items:center; gap:7px}
  .item .meta{font-size:11px; color:var(--side-sub); margin-top:3px; display:flex; gap:5px; flex-wrap:wrap}
  .dot{width:8px; height:8px; border-radius:50%; background:#3ddc84; flex:none}
  .dot.off{background:#5a6478}
  .pill{
    background:#2a3345; color:#b9c4d8; border-radius:999px; padding:0 7px;
    font-size:10px; line-height:16px;
  }
  .pill.warn{background:#5a3b12; color:#f5c66b}
  .side-btns{display:flex; flex-direction:column; gap:6px; margin-top:12px}
  .btn{
    border:1px solid var(--line); background:#fff; color:var(--text);
    border-radius:9px; padding:8px 13px; font-size:13px; transition:background .12s;
  }
  .btn:hover{background:#f0f3f8}
  .btn:active{transform:translateY(1px)}
  .btn.accent{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:700}
  .btn.accent:hover{background:var(--accent-dark)}
  .btn.side{background:#232a38; border-color:#232a38; color:var(--side-fg)}
  .btn.side:hover{background:#2d3648}
  .btn.danger{color:var(--danger)}
  .root-line{font-size:11px; color:var(--side-sub); margin-top:10px; word-break:break-all}
  .ver{font-size:11px; color:var(--side-sub); margin-top:4px}
  .ver.warn{color:#f5c66b}
  .ver.fail{color:#ff9d94}
  /* ---------- 言語切替 ---------- */
  .lang-row{display:flex; align-items:center; gap:8px; margin-top:12px; font-size:12px; color:var(--side-sub)}
  .lang-row select{
    background:var(--side-panel); border:1px solid #2a3345; border-radius:8px;
    color:var(--side-fg); padding:5px 8px; font-family:inherit; font-size:12px; outline:none;
  }
  .lang-row select:focus{border-color:var(--accent)}
  /* ---------- メイン ---------- */
  main{flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:12px}
  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); padding:16px 18px}
  .pname{font-size:20px; font-weight:700}
  .ppath{font-family:Consolas,"DejaVu Sans Mono",monospace; font-size:12px; color:var(--muted); margin-top:2px; word-break:break-all}
  .chips{display:flex; gap:6px; flex-wrap:wrap; margin-top:10px}
  .chip{background:#eef2f9; color:#33507e; border-radius:999px; padding:2px 10px; font-size:12px}
  .chip.gray{background:#eef0f3; color:var(--muted)}
  .chip.warn{background:#fdf0e0; color:#9a6206}
  .detail-lines{margin-top:10px; font-size:13px; color:#333d4f; line-height:1.7}
  .sec-title{font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--muted); margin-bottom:8px}
  .row{display:flex; gap:6px; flex-wrap:wrap}
  #log{
    background:#10141c; color:#c9d4e3; border-radius:var(--radius);
    font-family:Consolas,"DejaVu Sans Mono",monospace; font-size:12px;
    padding:12px 14px; height:180px; overflow-y:auto; white-space:pre-wrap;
    word-break:break-all; line-height:1.6;
  }
  .empty{color:var(--side-sub); font-size:13px; padding:10px 4px}
  /* ---------- 空状態（0件） ---------- */
  .empty-hero{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:48px 24px 40px; text-align:center;
    display:flex; flex-direction:column; align-items:center;
  }
  .empty-hero[hidden]{display:none}
  .empty-hero .big-plus{
    width:64px; height:64px; border-radius:50%; background:#e8effd; color:var(--accent);
    font-size:34px; font-weight:700; line-height:62px; margin-bottom:18px;
  }
  .empty-hero h2{font-size:19px; margin-bottom:8px}
  .empty-hero p{font-size:13px; color:var(--muted); line-height:1.8; max-width:440px}
  .empty-hero .row{margin-top:22px; justify-content:center}
  .field-err{display:none; font-size:12px; color:var(--danger); margin-top:4px}
  .field-err.show{display:block}
  .field input.invalid{border-color:var(--danger)}
  /* ---------- モーダル ---------- */
  .overlay{
    position:fixed; inset:0; background:rgba(15,20,30,.45); display:none;
    align-items:center; justify-content:center; z-index:10;
  }
  .overlay.open{display:flex}
  .modal{
    background:#fff; border-radius:14px; box-shadow:0 12px 40px rgba(0,0,0,.25);
    width:440px; max-width:92vw; padding:20px 22px;
  }
  .modal h2{font-size:16px; margin-bottom:14px}
  .field{margin-bottom:12px}
  .field label{display:block; font-size:12px; font-weight:700; color:var(--muted); margin-bottom:4px}
  .field input[type=text], .field select{
    width:100%; padding:8px 10px; border:1px solid var(--line); border-radius:8px;
    font-family:inherit; font-size:14px; outline:none;
  }
  .field input:focus, .field select:focus{border-color:var(--accent)}
  .check{display:flex; align-items:center; gap:7px; font-size:13px; margin-bottom:8px}
  .modal .row{justify-content:flex-end; margin-top:16px}
</style>
</head>
<body>
<aside>
  <h1 data-i18n="app_title">PJマネージャー</h1>
  <div class="sub">PROJECT MANAGER</div>
  <input id="filter" class="search" type="text" placeholder="プロジェクトを検索" data-i18n-placeholder="search_placeholder">
  <div class="side-label" data-i18n="side_projects">プロジェクト</div>
  <div id="list"></div>
  <div class="side-btns">
    <button class="btn accent" id="btn-new" data-i18n="btn_new">＋ 新規プロジェクト作成</button>
    <button class="btn side" id="btn-register" data-i18n="btn_register">既存フォルダを登録</button>
    <button class="btn side" id="btn-root" data-i18n="btn_root">作成先フォルダの設定</button>
  </div>
  <div class="lang-row">
    <label for="lang-select" data-i18n="lang_label">言語</label>
    <select id="lang-select">
      <option value="ja">日本語</option>
      <option value="en">English</option>
    </select>
  </div>
  <div class="root-line" id="root-line"></div>
  <div class="ver" id="doctor-line">環境チェック中…</div>
  <div class="ver" id="ver"></div>
</aside>

<main>
  <div class="card" id="detail-card">
    <div class="pname" id="d-name" data-i18n="detail_placeholder">プロジェクトを選んでください</div>
    <div class="ppath" id="d-path"></div>
    <div class="chips" id="d-chips"></div>
    <div class="detail-lines" id="d-lines"></div>
  </div>

  <div class="empty-hero" id="empty-hero" hidden>
    <div class="big-plus">＋</div>
    <h2 data-i18n="empty_title">まだプロジェクトがありません</h2>
    <p data-i18n="empty_text">新しいプロジェクトを作るか、すでにあるフォルダを登録すると、ここに一覧が表示されます。venv や Git の状態もひと目で確認できます。</p>
    <div class="row">
      <button class="btn accent" id="btn-new-empty" data-i18n="btn_new">＋ 新規プロジェクト作成</button>
      <button class="btn" id="btn-register-empty" data-i18n="btn_register">既存フォルダを登録</button>
    </div>
  </div>

  <div class="card" id="open-card">
    <div class="sec-title" data-i18n="sec_open">開く</div>
    <div class="row">
      <button class="btn accent" data-open="terminal" data-i18n="open_terminal">ターミナルで開く（venv有効化）</button>
      <button class="btn" data-open="vscode" data-i18n="open_vscode">VS Codeで開く</button>
      <button class="btn" data-open="folder" data-i18n="open_folder">フォルダを開く</button>
      <button class="btn danger" id="btn-unregister" data-i18n="btn_unregister">登録を外す</button>
    </div>
  </div>

  <div class="card" id="git-card">
    <div class="sec-title" data-i18n="sec_git">Git / GitHub</div>
    <div class="row">
      <button class="btn" id="btn-refresh" data-i18n="btn_refresh">状態を更新</button>
      <button class="btn" id="btn-commit" data-i18n="btn_commit">コミット</button>
      <button class="btn" data-git="push" data-i18n="btn_push">プッシュ</button>
      <button class="btn" data-git="pull" data-i18n="btn_pull">プル</button>
      <button class="btn" id="btn-log" data-i18n="btn_log">ログ（最近10件）</button>
      <button class="btn" id="btn-init">git init</button>
      <button class="btn" id="btn-gh-open" data-i18n="btn_gh_open">GitHubをブラウザで開く</button>
    </div>
  </div>

  <div>
    <div class="sec-title" data-i18n="sec_log">実行ログ</div>
    <div id="log"></div>
  </div>
</main>

<!-- 新規作成モーダル -->
<div class="overlay" id="modal-new">
  <div class="modal">
    <h2 data-i18n="modal_new_title">新規プロジェクト作成</h2>
    <div class="field">
      <label data-i18n="label_name">プロジェクト名（半角英数字・-・_）</label>
      <input type="text" id="f-name" placeholder="my-project">
      <div class="field-err" id="f-name-err"></div>
    </div>
    <div class="field">
      <label data-i18n="label_template">テンプレート</label>
      <select id="f-template"><option value="python">python</option><option value="empty">empty</option></select>
    </div>
    <label class="check"><input type="checkbox" id="f-venv" checked> <span data-i18n="check_venv">venv（.venv）を作成する</span></label>
    <label class="check"><input type="checkbox" id="f-git" checked> <span data-i18n="check_git">git init して最初のコミットまで作る</span></label>
    <div class="field">
      <label data-i18n="label_github">GitHubリポジトリ</label>
      <select id="f-github"><option value="none" data-i18n="gh_none">作らない</option><option value="private">private</option><option value="public">public</option></select>
    </div>
    <div class="row">
      <button class="btn" data-close data-i18n="btn_cancel">キャンセル</button>
      <button class="btn accent" id="f-create" data-i18n="btn_create">作成する</button>
    </div>
  </div>
</div>

<!-- コミットモーダル -->
<div class="overlay" id="modal-commit">
  <div class="modal">
    <h2 id="c-title" data-i18n="modal_commit_title">コミット</h2>
    <div class="field">
      <label data-i18n="label_commit_msg">コミットメッセージ</label>
      <input type="text" id="c-msg" placeholder="変更内容" data-i18n-placeholder="commit_msg_placeholder">
      <div class="field-err" id="c-msg-err"></div>
    </div>
    <div class="row">
      <button class="btn" data-close data-i18n="btn_cancel">キャンセル</button>
      <button class="btn accent" id="c-do" data-i18n="btn_commit_do">コミットする</button>
    </div>
  </div>
</div>

  demo_doctor_gh_warn: {ja: "gh CLI はありますがログインしていません",
                        en: "gh CLI is installed but not logged in"},
  demo_doctor_gh_hint: {ja: "ターミナルで `gh auth login` を実行してください",
                        en: "Run `gh auth login` in a terminal"},
  demo_doctor_root: {ja: "存在します: {dir}", en: "Exists: {dir}"},
  demo_doctor_data: {ja: "書き込めます: {dir}", en: "Writable: {dir}"},
  demo_doctor_registry: {ja: "{count} 件登録中（フォルダは全て存在します）",
                         en: "{count} registered (all folders exist)"},
  demo_doctor_config: {ja: "config.json が読めます", en: "config.json is readable"},
  demo_doctor_identity: {ja: "git のユーザー名・メールアドレスが設定済みです",
                         en: "git user.name / user.email is set"},
  log_doctor_item: {ja: "環境チェック {level}: {name} — {detail}",
                    en: "Environment check {level}: {name} — {detail}"},
  log_doctor_hint: {ja: "（{hint}）", en: " ({hint})"},
  dialog_register_title: {ja: "登録するプロジェクトのフォルダ",
                          en: "Folder of the project to register"},
  dialog_root_title: {ja: "新規プロジェクトの作成先フォルダ",
                      en: "Folder for new projects"},
};

let lang = "ja";
let lastDoctor = null;  /* 直近の doctor 結果（言語切替で表示し直す用） */
let rootDir = "";       /* 直近の projects_root（同上） */

function normalizeLang(v){ return (v === "en" || v === "ja") ? v : "ja"; }

/* CLI が返す素の値（ok / warn / fail、created / existing）を表示言語に
   訳す。未知の値はそのまま出す（将来の値が増えても表示が壊れない）。 */
function statusText(s){
  return {ok: t("status_ok"), warn: t("status_warn"), fail: t("status_fail")}[s] || s;
}
function originText(o){
  return {created: t("origin_created"), existing: t("origin_existing")}[o] || o;
}

function t(key, params){
  const entry = I18N[key] || {};
  let text = entry[lang] || entry.ja || key;
  if(params) for(const [k, v] of Object.entries(params)) text = text.replaceAll("{" + k + "}", v);
  return text;
}

/* data-i18n / data-i18n-placeholder の付いた静的表示を今の言語で書き直し、
   動的な一覧・詳細・doctor 行も描き直す（ログの既存行はそのまま）。 */
function applyLanguage(){
  document.documentElement.lang = lang;
  document.getElementById("ver").textContent = isTauri ? "Desktop (Tauri)" : t("ver_demo");
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.dataset.i18n;
    if(I18N[key]) el.textContent = t(key);
  });
  document.querySelectorAll("[data-i18n-placeholder]").forEach(el => {
    const key = el.dataset.i18nPlaceholder;
    if(I18N[key]) el.placeholder = t(key);
  });
  document.getElementById("lang-select").value = lang;
  renderDoctorLine();
  if(rootDir) document.getElementById("root-line").textContent = t("root_line", {dir: rootDir});
  renderList();
  const cur = projects.find(p => p.name === selected);
  if(cur) showDetail(cur);
  else document.getElementById("d-name").textContent = t("detail_placeholder");
}

function renderDoctorLine(){
  const el = document.getElementById("doctor-line");
  if(!lastDoctor){ el.textContent = t("doctor_checking"); return; }
  const d = lastDoctor;
  if(d.ok !== undefined){
    const s = d.summary || {ok: 0, warn: 0, fail: 0};
    el.textContent = t("doctor_line", {status: statusText(d.status), ok: s.ok, warn: s.warn, fail: s.fail});
    el.classList.toggle("warn", d.status === "warn");
    el.classList.toggle("fail", d.status === "fail");
  } else {
    el.textContent = t("doctor_unavailable");
  }
}

/* ブラウザでのデザインプレビュー用デモデータ（Tauri外では自動で使われる） */

/* デモ用の doctor 結果。表示言語で組み立てるため関数にしている */
function demoDoctor(){

    ok: true, status: "warn",
    summary: {ok: 8, warn: 1, fail: 0},

       hint: t("demo_doctor_gh_hint")},
      {name: "projects_root", level: "ok", detail: t("demo_doctor_root", {dir: "C:\\Users\\you\\Projects"})},
      {name: "data_dir", level: "ok", detail: t("demo_doctor_data", {dir: "C:\\Users\\you\\pj-manager-data"})},

let projects = [];
let selected = null;

function log(text){
  const el = document.getElementById("log");
  el.textContent += (el.textContent ? "\n" : "") + text;
  el.scrollTop = el.scrollHeight;
}

async function pj(args){
  if(!isTauri){
    log(t("demo_pj", {args: args.join(" ")}));
    if(args[0] === "list") return {ok:true, projects: DEMO_EMPTY ? [] : structuredClone(DEMO.projects)};
    if(args[0] === "status"){
      const p = DEMO.projects.find(x => x.name === args[1]) || DEMO.projects[0];
      return {ok:true, project:p};
    }
    if(args[0] === "config") return {ok:true, config:{projects_root:"C:\\Users\\you\\Projects"}};
    if(args[0] === "doctor") return demoDoctor();
    return {ok:true, output: t("demo_noop")};
  }
  return await invoke("pj", {args});
}

function badges(p){
  let h = "";
  if(p.git && p.git.is_git){
    h += `<span class="pill">${p.git.branch || "git"}</span>`;
    if(p.git.dirty > 0) h += `<span class="pill warn">${t("pill_uncommitted", {n: p.git.dirty})}</span>`;
    if(p.git.ahead > 0) h += `<span class="pill warn">↑${p.git.ahead}</span>`;
  } else {
    h += `<span class="pill">${t("pill_no_git")}</span>`;
  }
  if(!p.exists) h += `<span class="pill warn">${t("pill_folder_missing")}</span>`;
  return h;
}

function renderList(){
  const q = document.getElementById("filter").value.trim().toLowerCase();
  const el = document.getElementById("list");
  el.innerHTML = "";
  const shown = projects.filter(p => !q || p.name.toLowerCase().includes(q));
  if(!shown.length){
    el.innerHTML = `<div class="empty">${projects.length ? t("list_no_match") : t("list_empty")}</div>`;
    return;
  }
  for(const p of shown){
    const b = document.createElement("button");
    b.className = "item" + (selected === p.name ? " sel" : "");
    b.innerHTML = `<div class="name"><span class="dot ${p.has_venv ? "" : "off"}"></span>${p.name}</div>
                   <div class="meta">${badges(p)}</div>`;
    b.onclick = () => { selected = p.name; renderList(); showDetail(p); };
    el.appendChild(b);
  }
}

function showDetail(p){
  document.getElementById("d-name").textContent = p.name;
  document.getElementById("d-path").textContent = p.path;
  const chips = [];
  chips.push(`<span class="chip ${p.has_venv ? "" : "gray"}">${p.has_venv ? t("chip_venv_yes") : t("chip_venv_no")}</span>`);
  if(p.git && p.git.is_git){
    chips.push(`<span class="chip">${t("chip_branch", {branch: p.git.branch || "-"})}</span>`);
    if(p.git.dirty) chips.push(`<span class="chip warn">${t("chip_uncommitted", {n: p.git.dirty})}</span>`);
    if(p.git.ahead) chips.push(`<span class="chip warn">${t("chip_unpushed", {n: p.git.ahead})}</span>`);
    if(p.git.behind) chips.push(`<span class="chip warn">${t("chip_unpulled", {n: p.git.behind})}</span>`);
  } else {
    chips.push(`<span class="chip gray">${t("chip_not_git")}</span>`);
  }
  document.getElementById("d-chips").innerHTML = chips.join("");
  const lines = [t("detail_registered", {date: p.created_at || "-", origin: p.origin ? originText(p.origin) : "-"})];
  if(p.git && p.git.is_git){
    lines.push(t("detail_last_commit", {last: p.git.last_commit || "-"}));
    lines.push(t("detail_github", {remote: p.git.remote || t("detail_no_github")}));
  } else {
    lines.push(t("detail_git_init_hint"));
  }
  if(!p.exists) lines.push(t("detail_folder_missing"));
  document.getElementById("d-lines").innerHTML = lines.join("<br>");
}

async function refresh(selectName){
  const r = await pj(["list"]);
  if(!r.ok){ log(t("log_list_failed", {error: r.error || ""})); return; }
  projects = r.projects;
  if(selectName) selected = selectName;
  if(!selected && projects.length) selected = projects[0].name;
  renderList();
  renderEmpty();
  const cur = projects.find(p => p.name === selected);
  if(cur) showDetail(cur);
}

/* 0件のときは操作カードを隠して空状態ヒーローを出す */
function renderEmpty(){
  const empty = projects.length === 0;
  document.getElementById("empty-hero").hidden = !empty;
  document.getElementById("detail-card").hidden = empty;
  document.getElementById("open-card").hidden = empty;
  document.getElementById("git-card").hidden = empty;
}

function needSelected(){
  const p = projects.find(x => x.name === selected);
  if(!p){ log(t("log_select_first")); return null; }
  return p;
}

async function runAndReport(title, args){
  log("--- " + title + " ---");
  const r = await pj(args);
  if(r.ok){ log(r.output || t("log_success")); }
  else { log(t("log_failed", {error: r.error || ""})); }
  await refresh(selected);
}

/* ---------- イベント ---------- */
document.getElementById("filter").addEventListener("input", renderList);
document.getElementById("btn-refresh").onclick = () => refresh(selected);
document.getElementById("btn-log").onclick = async () => {
  const p = needSelected(); if(!p) return;
  const r = await pj(["log", p.name]);
  log("--- " + t("log_header", {name: p.name}) + " ---\n" + (r.ok ? (r.log || []).join("\n") : t("log_failed", {error: r.error})));
};
document.getElementById("btn-init").onclick = () => {
  const p = needSelected(); if(p) runAndReport("git init: " + p.name, ["init", p.name]);
};
document.getElementById("btn-gh-open").onclick = async () => {
  const p = needSelected(); if(!p) return;
  if(isTauri){ await invoke("open_target", {kind:"github", path:p.path}); }
  else log(t("demo_gh_open", {name: p.name}));
};
document.getElementById("btn-unregister").onclick = async () => {
  const p = needSelected(); if(!p) return;
  if(!confirm(t("confirm_unregister", {name: p.name}))) return;
  const r = await pj(["unregister", p.name]);
  log(r.ok ? t("log_unregistered", {name: p.name}) : t("log_failed", {error: r.error}));
  selected = null;
  await refresh(null);
};
document.querySelectorAll("[data-git]").forEach(b => {
  b.onclick = () => { const p = needSelected(); if(p) runAndReport(b.dataset.git + ": " + p.name, [b.dataset.git, p.name]); };
});
document.querySelectorAll("[data-open]").forEach(b => {
  b.onclick = async () => {
    const p = needSelected(); if(!p) return;
    if(isTauri){ await invoke("open_target", {kind:b.dataset.open, path:p.path}); log(t("log_opened", {name: p.name, label: b.textContent})); }
    else log(t("demo_open", {label: b.textContent, name: p.name}));
  };
});

/* モーダル */
function openModal(id){ document.getElementById(id).classList.add("open"); }
function closeModals(){ document.querySelectorAll(".overlay").forEach(o => o.classList.remove("open")); }
document.querySelectorAll("[data-close]").forEach(b => b.onclick = closeModals);
/* 背景クリックと Esc でも閉じる */
document.querySelectorAll(".overlay").forEach(o => o.addEventListener("click", e => { if(e.target === o) closeModals(); }));
document.addEventListener("keydown", e => { if(e.key === "Escape") closeModals(); });
document.getElementById("btn-new").onclick = () => openModal("modal-new");
document.getElementById("btn-new-empty").onclick = () => openModal("modal-new");
document.getElementById("btn-commit").onclick = () => {
  const p = needSelected(); if(!p) return;
  document.getElementById("c-title").textContent = t("commit_title", {name: p.name});
  document.getElementById("c-msg").value = "";
  document.getElementById("c-msg-err").classList.remove("show");
  document.getElementById("c-msg").classList.remove("invalid");
  openModal("modal-commit");
};

const NAME_RE = /^[A-Za-z0-9][A-Za-z0-9_-]*$/;
function setFieldError(inputEl, errEl, msg){
  if(msg){ errEl.textContent = msg; errEl.classList.add("show"); inputEl.classList.add("invalid"); }
  else { errEl.textContent = ""; errEl.classList.remove("show"); inputEl.classList.remove("invalid"); }
}
document.getElementById("f-name").addEventListener("input", () => {
  setFieldError(document.getElementById("f-name"), document.getElementById("f-name-err"), "");
});
document.getElementById("c-msg").addEventListener("input", () => {
  setFieldError(document.getElementById("c-msg"), document.getElementById("c-msg-err"), "");
});

document.getElementById("f-create").onclick = async () => {
  const nameEl = document.getElementById("f-name");
  const errEl = document.getElementById("f-name-err");
  const name = nameEl.value.trim();
  if(!NAME_RE.test(name)){
    setFieldError(nameEl, errEl, name
      ? t("err_name_chars")
      : t("err_name_required"));
    nameEl.focus();
    return;
  }
  setFieldError(nameEl, errEl, "");
  const args = ["create", name];
  if(!document.getElementById("f-venv").checked) args.push("--no-venv");
  if(!document.getElementById("f-git").checked) args.push("--no-git");
  const gh = document.getElementById("f-github").value;
  if(gh !== "none") args.push("--github", gh);
  closeModals();
  log("--- " + t("log_new", {name}) + " ---");
  const r = await pj(args);
  if(r.ok){ (r.log || []).forEach(l => log(l)); log(t("log_created")); await refresh(name); }
  else log(t("log_failed", {error: r.error || ""}));
};
document.getElementById("c-do").onclick = async () => {
  const p = needSelected(); if(!p) return;
  const msgEl = document.getElementById("c-msg");
  const msg = msgEl.value.trim();
  if(!msg){
    setFieldError(msgEl, document.getElementById("c-msg-err"), t("err_msg_required"));
    msgEl.focus();
    return;
  }
  closeModals();
  runAndReport("commit: " + p.name, ["commit", p.name, "-m", msg]);
};

async function registerFlow(){
  if(!isTauri){ log(t("demo_register")); return; }
  const dir = await dialogOpen({directory:true, multiple:false, title: t("dialog_register_title")});
  if(!dir) return;
  const r = await pj(["register", dir]);
  log(r.ok ? t("log_registered", {name: r.project.name}) : t("log_failed", {error: r.error}));
  await refresh(r.ok ? r.project.name : selected);
}
document.getElementById("btn-register").onclick = registerFlow;
document.getElementById("btn-register-empty").onclick = registerFlow;
document.getElementById("btn-root").onclick = async () => {
  if(!isTauri){ log(t("demo_register")); return; }
  const dir = await dialogOpen({directory:true, multiple:false, title: t("dialog_root_title")});
  if(!dir) return;
  const r = await pj(["config", "set-root", dir]);
  if(r.ok){ rootDir = dir; document.getElementById("root-line").textContent = t("root_line", {dir}); log(t("log_root_set", {dir})); }
};

/* 言語セレクト: Tauri では config set-language で保存し CLI / tkinter と
   共有する。デモでは localStorage にだけ保存する。 */
document.getElementById("lang-select").addEventListener("change", async (e) => {
  const v = normalizeLang(e.target.value);
  if(isTauri){
    const r = await pj(["config", "set-language", v]);
    if(!r.ok){ log(t("log_failed", {error: r.error || ""})); e.target.value = lang; return; }
  } else {
    try{ localStorage.setItem("pj_lang", v); }catch(_){}
  }
  lang = v;
  applyLanguage();
});

/* 初期化 */
(async () => {
  /* 表示言語: Tauri では config.json の language を読む。デモでは
     ?lang= が最優先、次に localStorage の pj_lang、既定は ja。 */
  if(isTauri){
    const cfg = await pj(["config", "show"]);
    if(cfg.ok){
      lang = normalizeLang(cfg.config && cfg.config.language);
      if(cfg.config.projects_root){
        rootDir = cfg.config.projects_root;
        document.getElementById("root-line").textContent = t("root_line", {dir: rootDir});
      }
    }
    applyLanguage();
  } else {
    const param = new URLSearchParams(location.search).get("lang");
    let saved = null;
    try{ saved = localStorage.getItem("pj_lang"); }catch(_){}
    lang = normalizeLang(param || saved);
    applyLanguage();
  }
  /* 起動時チェック: doctor の結果をサイドバーに表示し、問題があればログへ */
  try{
    const d = await pj(["doctor"]);
    lastDoctor = d;
    renderDoctorLine();
    for(const c of (d.checks || [])){
      if(c.level !== "ok") log(t("log_doctor_item", {level: statusText(c.level), name: c.name, detail: c.detail})
        + (c.hint ? t("log_doctor_hint", {hint: c.hint}) : ""));
    }
  }catch(e){
    lastDoctor = {};
    renderDoctorLine();
  }
  await refresh(null);
  log(isTauri ? t("ready") : t("demo_ready"));
})();
</script>
